# One-shot / reusable engine-api image build (NOT retrieval-api root Dockerfile).
substitutions:
  _IMAGE: us-central1-docker.pkg.dev/hauska-prod-497015/cloud-run-source-deploy/hauska-engine-api:latest
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}
      - -f
      - services/engine-api/Dockerfile
      - .
images:
  - ${_IMAGE}
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
