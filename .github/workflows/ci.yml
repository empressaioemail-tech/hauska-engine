name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # LOAD-BEARING: GitHub required status checks match this `name:` string,
  # not the workflow filename and not the job id. Renaming it drops the
  # requirement with no error. Mechanical control: job required-check-names
  # below, script scripts/ci/assert-required-check-names.mjs.
  ci:
    name: typecheck + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Setup Python (DXF/IFC workers)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python worker deps
        run: |
          python -m pip install --upgrade pip
          pip install -r artifacts/dxf-worker/requirements.txt
          pip install -r artifacts/ifc-worker/requirements.txt

      # Stdlib-only (no pysheds/rasterio needed). Locks the hydrology worker's
      # mask-to-region tracer to the TypeScript module's numbers so the pysheds
      # sidecar and the native-D8 fallback keep drawing the same geometry.
      - name: Test hydrology worker mask tracer (parity with the TS module)
        run: python artifacts/hydrology-worker/test_mask_regions.py

      - name: Typecheck
        run: pnpm typecheck

      - name: Retire road-class-setback-table (F-11)
        run: node packages/engine-core/scripts/retire-road-class-setback-table.mjs

      - name: Detect placeholder setback-rule citations (F-11)
        run: node packages/engine-core/scripts/detect-placeholder-setback-citation.mjs

      - name: Geometry lane LLM grep gate (OPS-3 I1)
        run: |
          if rg -i '\b(llm|anthropic|openai|xai)\b|@ai-sdk/|generateText' \
            packages/engine-core/src/depth-warm/ \
            packages/engine-core/src/geometry/ \
            packages/engine-core/src/warden/ \
            --glob '!**/__tests__/**'; then
            echo "FATAL: LLM reference detected in geometry lane path (depth-warm/geometry/warden must stay grep-clean)"
            exit 1
          fi
          echo "geometry lane LLM grep gate: clean"

      - name: Footprint writer staged-only grep (OPS-16 A-004)
        run: |
          WRITER=packages/engine-core/scripts/write-building-footprint-county.mjs
          for code in STAGED_FOOTPRINT_TABLE_MISSING STAGED_FOOTPRINT_COUNTY_EMPTY STAGED_FOOTPRINT_GEOM_UNREADY; do
            if ! grep -q "$code" "$WRITER"; then
              echo "FATAL: county writer must emit $code"
              exit 1
            fi
          done
          if ! grep -q 'assertStagedFootprintCountyReady' "$WRITER"; then
            echo "FATAL: county writer must call assertStagedFootprintCountyReady"
            exit 1
          fi
          if ! grep -q 'planCountyStagedFootprints' "$WRITER"; then
            echo "FATAL: county writer must call planCountyStagedFootprints"
            exit 1
          fi
          if ! grep -q 'joinStagedCandidatePairs' packages/engine-core/src/building-footprint/staged-footprint-join.ts; then
            echo "FATAL: staged-footprint-join must export joinStagedCandidatePairs (geometry-true attach)"
            exit 1
          fi
          if ! grep -q 'function loadMlForFixtureOrProbe' "$WRITER"; then
            echo "FATAL: loadMlFootprintsForBbox must be wrapped in loadMlForFixtureOrProbe"
            exit 1
          fi
          if grep -n 'await loadMlFootprintsForBbox' "$WRITER"; then
            echo "FATAL: unconditional await loadMlFootprintsForBbox in county writer"
            exit 1
          fi
          echo "footprint staged-only grep: clean"

      - name: Test
        run: pnpm test
        env:
          IFC_PYTHON: python
          DXF_PYTHON: python

  required-check-names:
    name: required check names
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove the rename assert can fail
        run: |
          node scripts/ci/assert-required-check-names.mjs \
            --expect-failure \
            --workflows-dir scripts/ci/fixtures/required-check-names/omit-required-name \
            --required-contexts "typecheck + test"
          node scripts/ci/assert-required-check-names.mjs \
            --expect-failure \
            --workflows-dir .github/workflows \
            --protection-json scripts/ci/fixtures/required-check-names/empty-protection.json

      - name: Assert required check-run names still exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/ci/assert-required-check-names.mjs
