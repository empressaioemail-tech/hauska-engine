name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # LOAD-BEARING: GitHub required status checks match this `name:` string,
  # not the workflow filename and not the job id. Renaming it drops the
  # requirement with no error. Mechanical control: job required-check-names
  # below, script scripts/ci/assert-required-check-names.mjs.
  ci:
    name: typecheck + test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Setup Python (DXF/IFC workers)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python worker deps
        run: |
          python -m pip install --upgrade pip
          pip install -r artifacts/dxf-worker/requirements.txt
          pip install -r artifacts/ifc-worker/requirements.txt

      # Stdlib-only (no pysheds/rasterio needed). Locks the hydrology worker's
      # mask-to-region tracer to the TypeScript module's numbers so the pysheds
      # sidecar and the native-D8 fallback keep drawing the same geometry.
      - name: Test hydrology worker mask tracer (parity with the TS module)
        run: python artifacts/hydrology-worker/test_mask_regions.py

      - name: Typecheck
        run: pnpm typecheck

      - name: Retire road-class-setback-table (F-11)
        run: node packages/engine-core/scripts/retire-road-class-setback-table.mjs

      - name: Detect placeholder setback-rule citations (F-11)
        run: node packages/engine-core/scripts/detect-placeholder-setback-citation.mjs

      - name: Retire bastrop-per-parcel setback authorship (P-219)
        run: node packages/engine-core/scripts/retire-bastrop-per-parcel-setback-authorship.mjs

      # P-279. The offline halves of tools/check-tagged-revision-env.mjs. This is
      # what keeps the rule alive on every push: the predicate's own fixture set
      # (pass, fail, four refusals) and the byte-hash against the sha256 recorded
      # in tools/fixtures/tagged-revision-env/canonical.json. No cloud access and
      # no credentials are needed, which is why it can live here.
      #
      # The LIVE check — the one that reads the five services and fails when a tag
      # points at a revision missing a credential the serving revision carries — is
      # NOT here, because this repo carries no deploy workflow for hauska-engine-api,
      # hauska-retrieval-api or hauska-mcp-server. Those deploys are hand
      # `gcloud run deploy` calls, so this repo's deploy path is the wrapper
      # tools/deploy-cloud-run-service.mjs, which runs the deploy and then runs the
      # check against the service it deployed. The wrapper's argument parsing is
      # smoke-tested below (--help, exit 0) because a deploy path nobody can invoke is
      # not a deploy path. Saying this here is the point: a reader must not mistake
      # this step for the interlock.
      #
      # Exit codes are kept distinguishable and 2 (REFUSE) FAILS: a check that
      # cannot read what it needs is never a pass (DEV_PROCESS 2.0/2.3).
      - name: Tagged-revision env predicate alive (P-279)
        run: |
          set +e
          node tools/check-tagged-revision-env.mjs --selftest
          SELF=$?
          node tools/check-tagged-revision-env.mjs --check-divergence
          DIV=$?
          set -e
          echo "p279 selftest=$SELF divergence=$DIV"
          if [ "$SELF" -ne 0 ]; then
            echo "FAIL p279-tagged-revision-env: the shipped fixture set did not pass (exit $SELF); the predicate is not measuring what it claims"
            exit 1
          fi
          if [ "$DIV" -ne 0 ]; then
            echo "FAIL p279-tagged-revision-env: divergence control failed (exit $DIV); this file no longer matches the sha256 recorded in tools/fixtures/tagged-revision-env/canonical.json"
            exit 1
          fi
          # The deploy path must be invocable. --help is the only mode that touches
          # nothing; every other mode either deploys or reads a live service.
          node tools/deploy-cloud-run-service.mjs --help > /dev/null
          echo "ci-tagged-revision-env: clean"

      - name: Geometry lane LLM grep gate (OPS-3 I1)
        run: |
          if rg -i '\b(llm|anthropic|openai|xai)\b|@ai-sdk/|generateText' \
            packages/engine-core/src/depth-warm/ \
            packages/engine-core/src/geometry/ \
            packages/engine-core/src/warden/ \
            --glob '!**/__tests__/**'; then
            echo "FATAL: LLM reference detected in geometry lane path (depth-warm/geometry/warden must stay grep-clean)"
            exit 1
          fi
          echo "geometry lane LLM grep gate: clean"

      - name: Footprint writer staged-only grep (OPS-16 A-004)
        run: |
          WRITER=packages/engine-core/scripts/write-building-footprint-county.mjs
          for code in STAGED_FOOTPRINT_TABLE_MISSING STAGED_FOOTPRINT_COUNTY_EMPTY STAGED_FOOTPRINT_GEOM_UNREADY; do
            if ! grep -q "$code" "$WRITER"; then
              echo "FATAL: county writer must emit $code"
              exit 1
            fi
          done
          if ! grep -q 'assertStagedFootprintCountyReady' "$WRITER"; then
            echo "FATAL: county writer must call assertStagedFootprintCountyReady"
            exit 1
          fi
          if ! grep -q 'planCountyStagedFootprints' "$WRITER"; then
            echo "FATAL: county writer must call planCountyStagedFootprints"
            exit 1
          fi
          if ! grep -q 'joinStagedCandidatePairs' packages/engine-core/src/building-footprint/staged-footprint-join.ts; then
            echo "FATAL: staged-footprint-join must export joinStagedCandidatePairs (geometry-true attach)"
            exit 1
          fi
          if ! grep -q 'function loadMlForFixtureOrProbe' "$WRITER"; then
            echo "FATAL: loadMlFootprintsForBbox must be wrapped in loadMlForFixtureOrProbe"
            exit 1
          fi
          if grep -n 'await loadMlFootprintsForBbox' "$WRITER"; then
            echo "FATAL: unconditional await loadMlFootprintsForBbox in county writer"
            exit 1
          fi
          echo "footprint staged-only grep: clean"

      - name: Test
        run: pnpm test
        env:
          IFC_PYTHON: python
          DXF_PYTHON: python

  required-check-names:
    name: required check names
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prove the rename assert can fail
        run: |
          node scripts/ci/assert-required-check-names.mjs \
            --expect-failure \
            --workflows-dir scripts/ci/fixtures/required-check-names/omit-required-name \
            --required-contexts "typecheck + test"
          node scripts/ci/assert-required-check-names.mjs \
            --expect-failure \
            --workflows-dir .github/workflows \
            --protection-json scripts/ci/fixtures/required-check-names/empty-protection.json

      - name: Assert required check-run names still exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/ci/assert-required-check-names.mjs
